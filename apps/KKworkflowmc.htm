<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FSM Quiz Builder</title>
    <style>
        /* Apple-system styling for the Builder UI */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: #f9f9f9; line-height: 1.6; }
        .container { display: flex; gap: 20px; margin-top: 40px; }
        .box-wrapper { flex: 1; position: relative; }
        textarea { width: 100%; height: 350px; padding: 15px; box-sizing: border-box; font-family: monospace; border: 1px solid #ccc; border-radius: 12px; }
        .controls { position: absolute; top: -35px; right: 0; display: flex; gap: 5px; }
        button { cursor: pointer; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        #build-btn { display: block; margin: 30px auto; padding: 15px 40px; background: #007AFF; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">FSM Quiz Builder</h2>
    <div class="container">
        <div class="box-wrapper">
            <h3>U1: Input JSON</h3>
            <div class="controls">
                <button onclick="paste('u1')">📋 Paste</button>
                <button onclick="copy('u1')">✂️ Copy</button>
            </div>
            <textarea id="u1" placeholder='{"start_node":"start", "nodes":[...], "transitions":[...]}'></textarea>
        </div>
        <div class="box-wrapper">
            <h3>U2: Resulting Quiz HTML</h3>
            <div class="controls">
                <button onclick="copy('u2')">✂️ Copy</button>
            </div>
            <textarea id="u2" readonly></textarea>
        </div>
    </div>
    <button id="build-btn" onclick="buildQuiz()">Build Interactive Quiz (B1)</button>

    <script>
        function copy(id) { navigator.clipboard.writeText(document.getElementById(id).value); alert('Copied!'); }
        async function paste(id) { document.getElementById(id).value = await navigator.clipboard.readText(); }

        function buildQuiz() {
            var jsonInput = document.getElementById('u1').value;
            try { JSON.parse(jsonInput); } catch (e) { alert("Invalid JSON: " + e.message); return; }

            var code = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">';
            code += '<style>';
            code += 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; line-height: 1.6; background-color: #f9f9f9; }';
            code += '#quiz { max-width: 500px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }';
            code += 'h2 { color: #333; font-size: 1.5em; margin-bottom: 20px; }';
            code += 'button { display: block; width: 100%; padding: 18px; margin: 12px 0; background: #007AFF; color: white; border: none; border-radius: 12px; font-size: 17px; cursor: pointer; transition: background 0.2s; }';
            code += 'button:active { background: #005bb5; }';
            code += '.path { margin-top: 25px; padding: 15px; background: #eef2f7; border-left: 5px solid #007AFF; border-radius: 4px; font-size: 0.9em; word-wrap: break-word; }';
            code += '#error-log { color: #d00; font-weight: bold; text-align: center; }';
            code += '</style></head><body>';
            code += '<div id="quiz"></div><div id="error-log"></div>';
            code += '<script>var fsm = ' + jsonInput + '; var hist = [];';
            code += 'function resetQuiz() { hist = []; run(fsm.start_node); }';
            code += 'function run(id) {';
            code += '  var cont = document.getElementById("quiz");';
            code += '  var n = fsm.nodes.filter(function(x){ return String(x.id).toLowerCase() == String(id).toLowerCase(); })[0];';
            code += '  if(n) hist.push(n.label);';
            code += '  var t = fsm.transitions.filter(function(x){ return String(x.from).toLowerCase() == String(id).toLowerCase(); });';
            code += '  if(t.length == 0) {';
            code += '    cont.innerHTML = "<h2>Finished</h2><p>Your journey is complete.</p><div class=\'path\'><strong>Path:</strong> " + hist.join(" > ") + "</div><button onclick=\'resetQuiz()\'>Start Over</button>";';
            code += '  } else {';
            code += '    var h = "<h2>" + (n ? n.label : id) + "</h2>";';
            code += '    for(var i=0; i<t.length; i++) { h += "<button onclick=\\"run(\'" + t[i].to + "\')\\">" + (t[i].condition || "Next") + "</button>"; }';
            code += '    cont.innerHTML = h;';
            code += '  }';
            code += '}';
            code += 'window.onload = function() { run(fsm.start_node); };';
            code += '<' + '/script></body></html>';
            document.getElementById('u2').value = code;
        }
    </script>
</body>
</html>
