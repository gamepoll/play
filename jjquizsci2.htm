<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 9 Thermal Physics Quiz</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .option-btn.selected {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <!-- Start Screen -->
    <div id="start-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
            <div class="flex justify-center mb-4 text-indigo-600">
                <i data-lucide="award" class="w-16 h-16"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Science Quiz</h1>
            <p class="text-slate-500 mb-8 uppercase text-xs font-bold tracking-widest">Grade 9 Thermal Physics</p>
            
            <div class="space-y-3 mb-8 text-left">
                <div class="flex justify-between items-center text-sm bg-slate-50 p-3 rounded-lg">
                    <span class="text-slate-500">Duration</span>
                    <span class="font-bold">30 Minutes</span>
                </div>
                <div class="flex justify-between items-center text-sm bg-slate-50 p-3 rounded-lg">
                    <span class="text-slate-500">Items</span>
                    <span class="font-bold">25 Questions</span>
                </div>
                <div class="flex justify-between items-center text-sm bg-slate-50 p-3 rounded-lg">
                    <span class="text-slate-500">Weight</span>
                    <span class="font-bold">20 Marks</span>
                </div>
            </div>

            <button onclick="quizApp.start()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-100">
                <i data-lucide="play" class="w-5 h-5"></i>
                <span>Begin Assessment</span>
            </button>
        </div>
    </div>

    <!-- Quiz Main UI -->
    <div id="quiz-container" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-3xl mx-auto">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                <div class="flex items-center space-x-4">
                    <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 flex items-center space-x-2">
                        <i data-lucide="timer" id="timer-icon" class="w-5 h-5 text-slate-500"></i>
                        <span id="timer-display" class="font-mono text-xl font-bold text-slate-700">30:00</span>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200">
                        <p class="font-bold text-slate-800"><span id="current-index">1</span> / 25</p>
                    </div>
                </div>
                <button onclick="quizApp.finish()" class="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold">Finish Early</button>
            </div>

            <div class="w-full bg-slate-200 rounded-full h-2 mb-8">
                <div id="progress-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: 4%"></div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div id="mark-badge" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-6 inline-block">0.5 Marks</div>
                
                <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-8 leading-tight">Loading question...</h2>

                <div id="options-container" class="space-y-3">
                    <!-- Options injected here -->
                </div>

                <div class="flex justify-between items-center mt-12 pt-6 border-t border-slate-100">
                    <button id="prev-btn" onclick="quizApp.prev()" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-50 transition-all">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        <span>Back</span>
                    </button>
                    <button id="next-btn" onclick="quizApp.next()" class="bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold flex items-center space-x-2">
                        <span>Next</span>
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden min-h-screen p-4 md:p-8">
        <div class="max-w-3xl mx-auto space-y-6">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-indigo-600 p-8 text-white text-center">
                    <i data-lucide="award" class="w-16 h-16 mx-auto mb-4"></i>
                    <h2 class="text-3xl font-bold mb-2">Score: <span id="final-score">0</span> / 20</h2>
                    <p class="text-indigo-100 opacity-90">Review your performance below.</p>
                </div>
                
                <div class="p-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <button onclick="quizApp.restartSame()" class="flex items-center justify-center gap-2 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition-all">
                            <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                            <span>Try Same Set</span>
                        </button>
                        <button onclick="quizApp.start()" class="flex items-center justify-center gap-2 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">
                            <i data-lucide="play" class="w-4 h-4"></i>
                            <span>Restart with New Set</span>
                        </button>
                    </div>

                    <div id="review-container" class="space-y-6">
                        <!-- Review items injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const QUESTION_POOL = [
            { id: 1, question: "Which of the following is the best definition of temperature?", options: ["The total internal energy", "The average kinetic energy of particles", "Heat flow", "Heat capacity"], answer: 1, marks: 0.5, explanation: "Temperature is a measure of the average kinetic energy of the particles." },
            { id: 2, question: "In which direction does heat spontaneously flow?", options: ["Small to large", "Cold to hot", "Higher temp to lower temp", "Only in solids"], answer: 2, marks: 0.5, explanation: "Heat flows from high temperature to low temperature." },
            { id: 3, question: "What is the SI unit for Heat Energy?", options: ["Celsius", "Kelvin", "Joules", "Watts"], answer: 2, marks: 0.5, explanation: "Energy is measured in Joules (J)." },
            { id: 4, question: "Absolute zero is the temperature at which...", options: ["Water freezes", "Molecular motion virtually stops", "Ice turns to steam", "Air becomes a liquid"], answer: 1, marks: 0.5, explanation: "At 0K, particle energy is at its theoretical minimum." },
            { id: 5, question: "Which method of heat transfer requires direct contact?", options: ["Radiation", "Convection", "Conduction", "Evaporation"], answer: 2, marks: 0.5, explanation: "Conduction relies on particle collisions." },
            { id: 6, question: "Warm air rising above a heater is an example of:", options: ["Conduction", "Convection", "Radiation", "Insulation"], answer: 1, marks: 0.5, explanation: "Convection involves the movement of fluid volumes." },
            { id: 7, question: "How does heat from the Sun reach the Earth?", options: ["Conduction", "Convection", "Radiation", "Sublimation"], answer: 2, marks: 1, explanation: "Radiation travels through vacuums as EM waves." },
            { id: 8, question: "Why are metals good conductors?", options: ["More mass", "Free-moving electrons", "Air pockets", "Reflect light"], answer: 1, marks: 1, explanation: "Delocalized electrons carry energy quickly." },
            { id: 9, question: "A 'Convection Current' is driven by changes in:", options: ["Mass", "Color", "Density", "Volume"], answer: 2, marks: 1, explanation: "Heating decreases density, causing the fluid to rise." },
            { id: 10, question: "Best absorber/emitter of radiation?", options: ["Shiny silver", "White matte", "Dull black", "Polished copper"], answer: 2, marks: 0.5, explanation: "Dull black surfaces absorb/emit best." },
            { id: 11, question: "SHC is energy to raise temperature of:", options: ["Any object by 1°C", "1 kg by 1°C", "1g by 10°C", "Until melting"], answer: 1, marks: 1, explanation: "SHC is energy per kg per degree." },
            { id: 12, question: "Substance A (400 J/kg°C) vs B (4000 J/kg°C). Equal heat added to 1kg:", options: ["A heats up more", "B heats up more", "Equal rise", "B cools faster"], answer: 0, marks: 1, explanation: "Lower SHC means temperature changes more easily." },
            { id: 13, question: "Energy to heat 2kg water (4200 J/kg°C) from 20°C to 30°C?", options: ["8,400 J", "42,000 J", "84,000 J", "168,000 J"], answer: 2, marks: 1.5, explanation: "Q = 2 * 4200 * 10 = 84,000 J." },
            { id: 14, question: "0.5kg block absorbs 2000 J, rises 10°C. SHC?", options: ["100", "200", "400", "1000"], answer: 2, marks: 1.5, explanation: "c = 2000 / (0.5 * 10) = 400 J/kg°C." },
            { id: 15, question: "In Q = mcΔT, ΔT is:", options: ["Final", "Initial", "Time", "Change in temp"], answer: 3, marks: 0.5, explanation: "Delta means 'change in'." },
            { id: 16, question: "Why does tile feel colder than a rug?", options: ["Lower temp", "Rug makes heat", "Tile conducts faster", "Rug is cold-conductor"], answer: 2, marks: 1, explanation: "Tile conducts body heat away faster." },
            { id: 17, question: "Double glazing works because trapped air:", options: ["Is a good conductor", "Is an insulator", "Attracts sun", "Moves fast"], answer: 1, marks: 1, explanation: "Gases are excellent insulators when trapped." },
            { id: 18, question: "During a change of state, temperature:", options: ["Rises", "Falls", "Stays constant", "Random"], answer: 2, marks: 1, explanation: "Energy goes into breaking bonds (latent heat)." },
            { id: 19, question: "Example of an insulator?", options: ["Aluminum", "Copper", "Styrofoam", "Iron"], answer: 2, marks: 0.5, explanation: "Styrofoam is a poor thermal conductor." },
            { id: 20, question: "Thermos inner wall is silvered to prevent:", options: ["Conduction", "Convection", "Radiation", "Evaporation"], answer: 2, marks: 1, explanation: "Silver reflects infra-red radiation." },
            { id: 21, question: "10,000 J removed from 1kg (SHC 500). Temp drop?", options: ["5°C", "10°C", "20°C", "50°C"], answer: 2, marks: 1.5, explanation: "10000 / 500 = 20." },
            { id: 22, question: "Sea breezes are caused by:", options: ["Conduction", "Radiation", "Convection", "Global warming"], answer: 2, marks: 1, explanation: "Convection currents due to land/sea heating diffs." },
            { id: 23, question: "Highest conductivity usually in:", options: ["Gases", "Liquids", "Solids", "Plasmas"], answer: 2, marks: 0.5, explanation: "Particles in solids are most tightly packed." },
            { id: 24, question: "Convection cannot happen in:", options: ["Kettle", "Balloon", "Solid bar", "Atmosphere"], answer: 2, marks: 1, explanation: "Solids don't allow bulk fluid flow." },
            { id: 25, question: "The Heat Equation for temp change is:", options: ["P=IV", "F=ma", "Q=mcΔT", "V=IR"], answer: 2, marks: 0.5, explanation: "Standard heat formula." },
            { id: 26, question: "Density of heated water (10 to 50°C):", options: ["Increases", "Decreases", "Same", "Zero"], answer: 1, marks: 1, explanation: "Expansion decreases density." },
            { id: 27, question: "Cooling liquid particle speed:", options: ["Increases", "Decreases", "Same", "Stops"], answer: 1, marks: 0.5, explanation: "Less KE means slower average speed." },
            { id: 28, question: "Best thermal insulator?", options: ["Copper", "Iron", "Vacuum", "Glass"], answer: 2, marks: 1, explanation: "Vacuums have no particles to conduct heat." },
            { id: 29, question: "Why metal at 0°C feels colder than plastic?", options: ["Actual lower temp", "Better conductor", "Plastic makes heat", "Higher SHC"], answer: 1, marks: 1, explanation: "Metal conducts heat away from skin faster." },
            { id: 30, question: "Main heat transfer in a copper rod:", options: ["Convection", "Radiation", "Conduction", "Evaporation"], answer: 2, marks: 0.5, explanation: "Conduction is for solids." },
            { id: 31, question: "Coolest shirt color for sun:", options: ["Black", "Blue", "White", "Red"], answer: 2, marks: 0.5, explanation: "White reflects most radiation." },
            { id: 32, question: "Internal energy is sum of:", options: ["PE and KE", "Mass/Speed", "Weight/Height", "Vol/Temp"], answer: 0, marks: 1, explanation: "Total energy of all particles." },
            { id: 33, question: "Heat added during boiling:", options: ["Specific", "Sensible", "Latent", "Conductive"], answer: 2, marks: 1, explanation: "Latent heat changes state, not temp." },
            { id: 34, question: "NOT affecting radiation emission:", options: ["Area", "Temp", "Color", "Weight"], answer: 3, marks: 1, explanation: "Mass doesn't affect surface emission properties." },
            { id: 35, question: "In a Sea Breeze, air rises over:", options: ["Sea", "Land", "None", "Horizon"], answer: 1, marks: 1, explanation: "Air rises over warm land." }
        ];

        let quizApp = {
            currentSet: [],
            userAnswers: [],
            currentIndex: 0,
            timeLeft: 1800,
            timer: null,

            start() {
                // Shuffle and pick 25
                this.currentSet = [...QUESTION_POOL].sort(() => 0.5 - Math.random()).slice(0, 25);
                this.userAnswers = new Array(25).fill(null);
                this.currentIndex = 0;
                this.timeLeft = 1800;
                this.showScreen('quiz-container');
                this.updateQuestion();
                this.startTimer();
            },

            restartSame() {
                this.userAnswers = new Array(25).fill(null);
                this.currentIndex = 0;
                this.timeLeft = 1800;
                this.showScreen('quiz-container');
                this.updateQuestion();
                this.startTimer();
            },

            showScreen(id) {
                ['start-screen', 'quiz-container', 'result-screen'].forEach(s => {
                    document.getElementById(s).classList.add('hidden');
                });
                document.getElementById(id).classList.remove('hidden');
            },

            updateQuestion() {
                const q = this.currentSet[this.currentIndex];
                document.getElementById('question-text').innerText = q.question;
                document.getElementById('current-index').innerText = this.currentIndex + 1;
                document.getElementById('mark-badge').innerText = `${q.marks} Mark${q.marks === 1 ? '' : 's'}`;
                
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between group ${this.userAnswers[this.currentIndex] === idx ? 'border-indigo-500 bg-indigo-50' : 'border-slate-100 bg-slate-50 hover:border-indigo-200 hover:bg-white'}`;
                    btn.onclick = () => this.selectOption(idx);
                    btn.innerHTML = `<span>${opt}</span><div class="w-5 h-5 rounded-full border-2 ${this.userAnswers[this.currentIndex] === idx ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300'}"></div>`;
                    container.appendChild(btn);
                });

                document.getElementById('progress-bar').style.width = `${((this.currentIndex + 1) / 25) * 100}%`;
                document.getElementById('prev-btn').style.visibility = this.currentIndex === 0 ? 'hidden' : 'visible';
                document.getElementById('next-btn').innerText = this.currentIndex === 24 ? 'Finish' : 'Next';
                
                lucide.createIcons();
            },

            selectOption(idx) {
                this.userAnswers[this.currentIndex] = idx;
                this.updateQuestion();
            },

            next() {
                if (this.currentIndex < 24) {
                    this.currentIndex++;
                    this.updateQuestion();
                } else {
                    this.finish();
                }
            },

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.updateQuestion();
                }
            },

            startTimer() {
                if (this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    const mins = Math.floor(this.timeLeft / 60);
                    const secs = this.timeLeft % 60;
                    document.getElementById('timer-display').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                    
                    if (this.timeLeft < 300) {
                        document.getElementById('timer-display').classList.add('text-red-600');
                        document.getElementById('timer-icon').classList.add('text-red-500', 'animate-pulse');
                    }

                    if (this.timeLeft <= 0) {
                        this.finish();
                    }
                }, 1000);
            },

            finish() {
                clearInterval(this.timer);
                let score = 0;
                this.currentSet.forEach((q, i) => {
                    if (this.userAnswers[i] === q.answer) score += q.marks;
                });
                
                document.getElementById('final-score').innerText = score;
                this.renderReview();
                this.showScreen('result-screen');
                lucide.createIcons();
            },

            renderReview() {
                const container = document.getElementById('review-container');
                container.innerHTML = '';
                this.currentSet.forEach((q, i) => {
                    const isCorrect = this.userAnswers[i] === q.answer;
                    const div = document.createElement('div');
                    div.className = `p-6 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}`;
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <p class="font-bold text-slate-800 pr-4">${i + 1}. ${q.question}</p>
                            <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="${isCorrect ? 'text-emerald-600' : 'text-red-600'}"></i>
                        </div>
                        <div class="text-sm text-slate-600 mb-4 italic">Correct: ${q.options[q.answer]}</div>
                        <div class="bg-white/60 p-3 rounded-lg text-xs text-slate-700 border border-slate-200">
                            <span class="font-bold">Explanation:</span> ${q.explanation}
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
        };

        // Init icons on load
        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
