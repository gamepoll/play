<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Challenge Pro</title>
    <style>
        :root {
            --primary: #007AFF; --success: #34C759; --error: #FF3B30;
            --warning: #FF9500; --bg: #1c1c1e; --card: #FFFFFF; --text: #1C1C1E;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg); margin: 0; display: flex;
            align-items: center; justify-content: center; min-height: 100vh;
            position: fixed; width: 100%; height: 100%; overflow: hidden;
        }

        #quiz-app {
            width: 100%; height: 100%; max-width: 500px;
            background: var(--card); display: flex; flex-direction: column;
            position: relative;
        }

        @media (min-width: 600px) { 
            #quiz-app { border-radius: 24px; height: 90vh; max-height: 850px; } 
        }

        header { padding: 15px; text-align: center; border-bottom: 1px solid #eee; padding-top: env(safe-area-inset-top, 15px); }
        #timer-display { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .progress-bar { height: 5px; background: #eee; width: 100%; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        #content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px 20px 140px 20px; 
            -webkit-overflow-scrolling: touch;
        }

        .math-box { background: #f2f2f7; padding: 20px; border-radius: 15px; text-align: center; font-size: 1.4rem; margin: 15px 0; border: 1px solid #e5e5ea; }
        .option-btn { width: 100%; padding: 16px; margin-bottom: 10px; border: 2px solid #e5e5ea; border-radius: 14px; background: #fff; font-size: 1.05rem; cursor: pointer; text-align: left; }
        .option-btn.selected { border-color: var(--primary); background: #f0f7ff; }

        /* RIGHT-SIDE BUTTON POSITIONING */
        footer { 
            position: absolute; 
            bottom: calc(38px + env(safe-area-inset-bottom, 0px)); 
            right: 20px; /* Align to right */
            display: flex; 
            flex-direction: column; /* Stacked for thumb reach */
            gap: 12px; 
            background: transparent;
            z-index: 10;
            width: 140px; /* Constrain width to right side */
        }

        .btn { 
            width: 100%;
            padding: 15px; border-radius: 14px; border: none; 
            font-weight: 600; font-size: 1rem; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: #e5e5ea; color: #333; }
        .btn-redo { background: var(--warning); color: #fff; margin-top: 10px; width: 100%; }

        .result-card { background: #f9f9fb; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid #ccc; }
        .correct-card { border-left-color: var(--success); }
        .wrong-card { border-left-color: var(--error); }
        
        svg { display: block; margin: 10px auto; max-width: 100%; height: auto; overflow: visible; }
    </style>
</head>
<body>

<div id="quiz-app">
    <header><div id="timer-display">03:00</div></header>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="content"></div>

    <footer id="footer-nav">
        <button class="btn btn-primary" id="nextBtn" onclick="move(1)">Next</button>
        <button class="btn btn-secondary" id="prevBtn" onclick="move(-1)">Back</button>
    </footer>
</div>

<audio id="buzz" src="https://actions.google.com/sounds/v1/alarms/alarm_clock_beeping.ogg"></audio>

<script>
    const data = [
        { id: 0, q: "Solve: 27 / (4x - 3) = 5", opts: ["x = 1.6", "x = 2.1", "x = 1.5"], ans: 1, exp: "27 = 20x - 15 → 42 = 20x → x = 2.1" },
        { id: 1, q: "(t - y) is a third of (t + y). Write t in terms of y.", opts: ["t = 3y", "t = 2y", "t = 0.5y"], ans: 1, exp: "3(t - y) = t + y → 2t = 4y → t = 2y" },
        { id: 2, q: "Expand: (x + 3)²", opts: ["x² + 9", "x² + 6x + 9", "x² + 3x + 9"], ans: 1, exp: "(x+3)(x+3) = x² + 6x + 9" },
        { id: 3, q: "Calculate shaded area (slanted rectangle):", opts: ["1,530 cm²", "1,734 cm²", "2,040 cm²"], ans: 1, exp: "Slant AC = √(16²+30²) = 34. Area = 34 * 51 = 1,734 cm²", svg: true }
    ];

    let questions = [], current = 0, picks = {}, time = 180, timer;

    function init() {
        questions = [...data].sort(() => Math.random() - 0.5);
        current = 0; picks = {}; time = 180;
        document.getElementById('footer-nav').style.display = 'flex';
        startTimer(); render();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            time--;
            let m = Math.floor(time/60), s = time%60;
            document.getElementById('timer-display').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            if (time <= 0) { clearInterval(timer); document.getElementById('buzz').play(); alert("⏰ TIME'S UP!"); finish(); }
        }, 1000);
    }

    function render() {
        const q = questions[current];
        document.getElementById('content').innerHTML = `
            <p style="color:#8e8e93; font-weight:bold; font-size:0.9rem;">QUESTION ${current+1} OF 4</p>
            <p style="font-size:1.15rem; font-weight:600; margin-bottom:15px;">${q.q}</p>
            ${q.svg ? `
            <svg width="260" height="150" viewBox="0 0 280 150">
                <path d="M 40 100 L 120 100 L 240 50 L 160 50 Z" fill="#E5E5EA" stroke="#333" />
                <path d="M 40 60 L 160 10 L 240 50 L 120 100 Z" fill="#999" stroke="#333" />
                <path d="M 40 60 L 40 100 L 120 100 Z" fill="none" stroke="#333" />
                <text x="32" y="55" font-weight="bold" fill="blue">A</text>
                <text x="32" y="115" font-weight="bold" fill="blue">B</text>
                <text x="122" y="115" font-weight="bold" fill="blue">C</text>
                <text x="162" y="10" font-weight="bold" fill="blue">D</text>
                <text x="0" y="85" font-size="12">16cm</text>
                <text x="65" y="118" font-size="12">30cm</text>
                <text x="190" y="90" font-size="12">51cm</text>
            </svg>` : `<div class="math-box">${q.q.split(': ')[1] || ""}</div>`}
            <div style="margin-top:20px;">
                ${q.opts.map((o,i) => `<button class="option-btn ${picks[current]===i?'selected':''}" onclick="pick(${i})">${o}</button>`).join('')}
            </div>
        `;
        document.getElementById('progress-fill').style.width = (current/4*100)+'%';
        document.getElementById('prevBtn').disabled = current === 0;
        document.getElementById('nextBtn').innerText = current === 3 ? "Finish" : "Next";
        document.getElementById('content').scrollTop = 0;
    }

    function pick(i) { picks[current] = i; render(); }
    
    function move(step) { 
        if (step === 1 && current === 3) { finish(); return; } 
        current += step; render(); 
    }

    function finish() {
        clearInterval(timer);
        document.getElementById('footer-nav').style.display = 'none';
        let score = 0;
        let html = questions.map((q,i) => {
            const isCorr = picks[i] === q.ans; if(isCorr) score++;
            return `<div class="result-card ${isCorr?'correct-card':'wrong-card'}">
                <strong>Q${i+1}: ${isCorr?'✅ Correct':'❌ Incorrect'}</strong>
                <p style="margin-top:5px; font-size:0.9rem; color:#444;">${q.exp}</p>
            </div>`;
        }).join('');
        document.getElementById('content').innerHTML = `
            <h1 style="text-align:center; margin-bottom:5px;">${score}/4</h1>
            <p style="text-align:center; color:#8e8e93; margin-bottom:20px;">Review Explanations</p>
            ${html}
            <button class="btn btn-redo" onclick="init()">Restart Quiz</button>
        `;
    }

    init();
</script>
</body>
</html>
